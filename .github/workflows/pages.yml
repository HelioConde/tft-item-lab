name: Deploy GitHub Pages (validated static site)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: static-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Check source and static assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and source structure
        run: |
          npm run check
          test -f index.html
          test -f app.js
          test -f backend-config.js
          test -f style.css
          test -f privacidade.html
          test -f sobre.html
          test -f termos.html

  pages-ready:
    name: Check Pages configuration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - id: pages
        name: Validate existing GitHub Actions Pages source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          status="$(curl --silent --show-error --output /tmp/pages.json --write-out '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPOSITORY}/pages")"
          if [ "$status" = "200" ] && [ "$(jq -r '.build_type // "unknown"' /tmp/pages.json)" = "workflow" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Pages: Source GitHub Actions. Deploy habilitado." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages needs admin setup::Settings > Pages > Source: GitHub Actions. HTTP ${status}; deploy skipped."
            {
              echo "## Pages ainda não pronto"
              echo "QA independente. **Nenhuma publicação realizada por este workflow.**"
              echo "Abra Settings → Pages → Build and deployment → Source: GitHub Actions e execute novamente."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    if: github.event_name != 'pull_request' && needs.pages-ready.outputs.deploy == 'true'
    needs: [qa, pages-ready]
    name: Deploy static HTML/JS/CSS
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Package only public frontend resources
        run: |
          mkdir -p dist-pages
          cp *.html *.js *.css robots.txt sitemap.xml dist-pages/
          printf '{"sha":"%s","publishedAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > dist-pages/version.json
          touch dist-pages/.nojekyll
          test -f dist-pages/index.html
          test -f dist-pages/backend-config.js
          test -f dist-pages/app.js
          ! find dist-pages -type f | grep -Ei '\.(php|sql|env|zip)$'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
      - name: Publish to Pages
        id: deployment
        uses: actions/deploy-pages@v4
